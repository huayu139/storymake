# 人物卡模板（bible/characters/<id>.yaml）
# 五件套 + 声音是核心；不写外貌清单，写压力下的选择
id: char-id                  # 英文短横线小写
name: 角色名
role: protagonist            # protagonist / antagonist / supporting

# —— 五件套（全部必填）——
want: 外在目标（具体可追，一句话）
fear: 内在恐惧（与 want 构成冲突）
secret: 绝不让别人知道的事
lie: 对自己撒的谎（他真心相信的假话）
wound: 哪一年被什么事改变

arc: 一句话人物弧线（从…到…）

# —— 可拍的形象四件套（QC 必填，剧本首次出场的【人物】行要与它一致）——
persona: 个性（压力下的行为倾向，写可执行的指令，不写"温柔/强势"这类空形容词）
appearance: 外表（年龄感、体型、脸与手——摄影机拍得到的，别写气质）
wardrobe: 穿着（标志性穿戴；可随 progressions 变化，注明哪个集数换装）
signature: 特征（习惯动作、身体标记、随身物——特写能一眼认出他）

# —— 别名：剧本在场人物行里他可能被叫的名字（与 name 不一致时必填）——
aliases: [他/她的别称或外号]

# —— 声音（遮名可辨）——
voice_samples:               # 5 句只有他会说的话
  - 台词一
  - 台词二
  - 台词三
  - 台词四
  - 台词五
voice_rules:                 # 可执行指令，不写"温柔/强势"形容词
  - 短句
  - 爱用反问
never_say:                   # ≥2 句他绝不会说的话
  - 你听我解释

# —— 随时间变化的状态（NovelCrafter 式 progressions）——
progressions:
  - { at: e01, state: 初始状态一句话 }
  - { at: e06, state: 转变后状态一句话 }

visible_from: 1              # 从第几集起对模型可见（防剧透）
version: 1
